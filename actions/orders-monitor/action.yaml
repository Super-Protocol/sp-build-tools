name: 'Orders Monitor'
description: 'Create or delete recors into order monitor database through http requests.'
inputs:
  url:
    description: 'The URL to send the HTTP request to.'
    required: false
    default: 'https://critical-orders.superprotocol.com/api/v1/orders'
  api_key:
    description: 'API key for authentication.'
    required: true
  orders:
    description: 'Array of orders (comma-separated).'
    required: true
  name:
    description: 'Name field'
    required: false
    default: ''
  description:
    description: 'Description field'
    required: false
    default: ''
  mode:
    description: 'Action mode: create or delete.'
    required: false
    default: 'create'
    type: choice
    options:
      - create
      - delete
runs:
  using: 'composite'
  steps:
    - name: Create orders
      if: ${{ inputs.mode == 'create' }}
      shell: bash
      run: |
        set -e
        URL="${{ inputs.url }}"
        API_KEY="${{ inputs.api_key }}"
        ORDERS="${{ inputs.orders }}"
        NAME="${{ inputs.name }}"
        DESCRIPTION="${{ inputs.description }}"

        IFS=',' read -ra ARR <<< "$ORDERS"
        for ORDER in "${ARR[@]}"; do
          JSON_BODY="{\"id\": \"$ORDER\", \"name\": \"$NAME\", \"description\": \"$DESCRIPTION\"}"
          echo "Sending: $JSON_BODY"
          set +e
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "authorization: $API_KEY" \
            -d "$JSON_BODY")
          set -e
          if [ "$HTTP_CODE" != "201" ]; then
            echo "Request failed with HTTP status code: $HTTP_CODE"
            echo "Response body:" && cat response.txt
            exit 1
          fi
          echo "HTTP status code: ${HTTP_CODE}"
        done
    - name: Delete orders
      if: ${{ inputs.mode == 'delete' }}
      shell: bash
      run: |
        set -e
        URL="${{ inputs.url }}"
        API_KEY="${{ inputs.api_key }}"
        ORDERS="${{ inputs.orders }}"
        IFS=',' read -ra ARR <<< "$ORDERS"
        for ORDER in "${ARR[@]}"; do
          ENCODED_ORDER=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$ORDER")
          echo "Deleting order: $ORDER (encoded: $ENCODED_ORDER)"
          set +e
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X DELETE "$URL/$ENCODED_ORDER" \
            -H "authorization: $API_KEY")
          set -e
          if [ "$HTTP_CODE" != "204" ]; then
            echo "Delete failed with HTTP status code: $HTTP_CODE"
            echo "Response body:" && cat response.txt
            exit 1
          fi
          echo "HTTP status code: ${HTTP_CODE}"
        done

